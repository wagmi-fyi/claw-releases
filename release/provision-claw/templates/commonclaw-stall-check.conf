# When this claw says out loud that an orchestration stopped being read.
# Written by provision-claw.sh. NO SECRETS HERE.
#
# ENABLED           yes  the beat runs and posts through commonclaw-notify.sh.
#                   no   the beat exits quietly. A deliberate silence.
#
# THRESHOLD_HOURS   how long mail sits in an orchestrator handle before it
#                   counts as a stall. Three hours means an overnight stall is
#                   announced once by breakfast and a working run is left alone.
#
# DEDUPE_HOURS      how long one distinct set of stalled handles stays quiet.
#                   Twenty matches the seat check: a persistent stall says so
#                   once a day, and a NEW stall breaks through the same beat it
#                   appears, because the key carries the set.
#
# BUS_DIRS          space-separated. Empty means discover: the claw's own bus
#                   plus each member's own under their home.
ENABLED="yes"
THRESHOLD_HOURS=3
DEDUPE_HOURS=20
BUS_DIRS=""
