# /etc/commonclaw/email-gatekeeper.conf -- the machine's ruling for the mail
# gatekeeper.
#
# Every setting resolves in one order: the environment (EMAIL_GATEKEEPER_<KEY>),
# then this file, then the shipped default. First match wins, and nothing is
# merged. This file is optional: with none of it present the service runs on its
# shipped defaults.
#
# NO SECRET HERE. The provider key is a credential and none rests on this claw.
# /etc/commonclaw/email-gatekeeper.env holds the reference the service resolves
# at start, and a reference is not a value.
#
# A KEY THIS FILE GAINS IN A LATER RELEASE IS APPENDED TO A CONF THAT ALREADY
# EXISTS, with its shipped default and a comment naming the release. No key
# already here is ever rewritten, whatever its value.
#
# ENABLED       yes runs the gatekeeper, no turns it off without uninstalling
#               it. A deliberate silence: the service exits clean and no mail is
#               routed or sent.
# ADAPTER       which provider adapter to use. `agentmail` is the one this
#               release ships for real mail. `fake` reaches no network and
#               exists for controls.
# ADAPTER_DIR   where the adapters live. Empty means beside the program.
# STATE_DIR     the routing table and the thread map. Under /srv, so both ride
#               the backup rail. Neither holds a secret or any message text.
# LOG_DIR       the send log. Subjects and addresses, never message bodies.
# SOCKET        where the `email` command reaches the service. The command reads
#               this same file, so moving it moves both.
# SOCKET_GROUP  the group that may open the socket. Unix permissions are the
#               whole access story for this service.
# BUS_CLI       the session-bus program.
# BUS_DIR       which bus inbound mail is announced on. Empty lets the CLI use
#               its own default, which on a claw with a shared bus is the wrong
#               answer often enough to be worth setting.
# BUS_HANDLE    the handle the gatekeeper's messages come from.
# RECONNECT_MIN_SECS / RECONNECT_MAX_SECS
#               the ladder a dropped push connection is retried on. It doubles
#               from the first to the second, with jitter, so a provider outage
#               does not give every claw on the rail one synchronised retry.
#
# THE MAIL CHECK reads the three keys below. It runs every five minutes as root
# and tells a named person when mail on this claw is not being handled.
# MAIL_ALERT_TO one person's address. The alert goes there by mail, through
#               this service, and to the claw's notifier. Empty means the
#               notifier only.
# LATE_MINUTES  how long a mail may wait unread, or the service may stay
#               disconnected, before the check alerts.
# REMIND_HOURS  how often an alert repeats while the same mail stays unread.
#               A new late mail alerts at once.

ENABLED="yes"
ADAPTER="agentmail"
ADAPTER_DIR=""
STATE_DIR="/srv/connections/email-gatekeeper/state"
LOG_DIR="/srv/connections/email-gatekeeper/log"
SOCKET="/run/email-gatekeeper/sock"
SOCKET_GROUP="claw-members"
BUS_CLI="/opt/commonclaw/bin/bus"
BUS_DIR="/var/lib/commonclaw/bus"
BUS_HANDLE="email-gatekeeper"
RECONNECT_MIN_SECS="1"
RECONNECT_MAX_SECS="60"
MAIL_ALERT_TO=""
LATE_MINUTES="60"
REMIND_HOURS="24"
