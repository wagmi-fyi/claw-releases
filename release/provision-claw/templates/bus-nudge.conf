# /etc/commonclaw/bus-nudge.conf -- the machine's ruling for the wake rail.
#
# Every setting resolves in one order: the command line or the environment
# (BUS_NUDGE_<KEY>), then this file, then the shipped default. First match
# wins, and nothing is merged. This file is optional: with none of it present
# the rail runs on its shipped defaults.
#
# A KEY THIS FILE GAINS IN A LATER RELEASE IS APPENDED TO A CONF THAT ALREADY
# EXISTS, with its shipped default and a comment naming the release. No key
# already here is ever rewritten, whatever its value. So a setting added after
# this claw was built still reaches you, and a setting you tuned stays tuned.
#
# ENABLED       yes turns the rail on, no turns it off without uninstalling it.
# ADAPTER       which delivery adapter to use: claude, tmux, codex. Leave it
#               empty to detect, which is the shipped behaviour and the right
#               answer on a machine that runs one kind of session.
# BUS_DIRS      space-separated bus roots to watch. Empty means discover: the
#               shared bus this machine records under ORCHESTRATE_SHARED_BUS
#               in /etc/orchestrate.conf, plus this account's own.
# POLL_SECS     how often to look while a session is reachable. An idle
#               session's supervisor exits about 65 seconds after it goes
#               quiet, so this is seconds, not minutes.
# IDLE_POLL_SECS how often to look again while nobody on this account is signed
#               in. Longer than POLL_SECS, because with no session there is
#               nothing to deliver and nothing time-critical to miss. It is
#               never taken shorter than POLL_SECS whatever is written here.
# STATE_DIR     where the one-nudge-per-message dedupe state is kept. It is
#               never written onto a bus: a rail that wrote its own state into
#               an inbox would raise unread mail and nudge itself forever.

ENABLED="yes"
ADAPTER=""
BUS_DIRS=""
POLL_SECS="5"
IDLE_POLL_SECS="60"
